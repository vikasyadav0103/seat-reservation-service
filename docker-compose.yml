services:
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOCAL_DB_HOST: ${LOCAL_DB_HOST:-}
      LOCAL_DB_PORT: ${LOCAL_DB_PORT:-5432}
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-}
      LOCAL_DB_USERNAME: ${LOCAL_DB_USERNAME:-}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-}
      LOCAL_DB_SSL_MODE: ${LOCAL_DB_SSL_MODE:-disable}
      PROD_DB_HOST: ${PROD_DB_HOST:-}
      PROD_DB_PORT: ${PROD_DB_PORT:-5432}
      PROD_DB_NAME: ${PROD_DB_NAME:-}
      PROD_DB_USERNAME: ${PROD_DB_USERNAME:-}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD:-}
      PROD_DB_SSL_MODE: ${PROD_DB_SSL_MODE:-require}
      PROD_DB_CHANNEL_BINDING: ${PROD_DB_CHANNEL_BINDING:-require}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8080:8080"
