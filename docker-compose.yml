services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: ${DB_NAME:-seat_reservation}
      POSTGRES_USER: ${DB_USERNAME:-seat_reservation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seat_reservation}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-seat_reservation}
      DB_USERNAME: ${DB_USERNAME:-seat_reservation}
      DB_PASSWORD: ${DB_PASSWORD:-seat_reservation}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
